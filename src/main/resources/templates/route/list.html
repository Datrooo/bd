<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Маршруты')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <section class="panel-card">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center mb-4">
            <div>
                <div class="eyebrow">CRUD</div>
                <h1 class="section-title mb-1">Маршруты</h1>
                <p class="section-description mb-0">Список маршрутов предприятия с базовым управлением карточками маршрутов.</p>
            </div>
            <a class="btn btn-dark" th:href="@{/routes/new}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN, T(ru.autoenterprise.security.AppRole).DISPATCHER)}">Добавить маршрут</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Номер</th>
                    <th>Название</th>
                    <th>Тип</th>
                    <th>Направление</th>
                    <th>Длина</th>
                    <th>Статус</th>
                    <th class="text-end">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.isEmpty()}">
                    <td colspan="7" class="text-center text-muted py-4">Маршруты пока не добавлены.</td>
                </tr>
                <tr th:each="route : ${page.content}">
                    <td th:text="${route.routeNumber}">12</td>
                    <td th:text="${route.name}">Центр - Вокзал</td>
                    <td th:text="${route.routeType}">BUS</td>
                    <td>
                        <div th:text="${route.startPoint}">Центр</div>
                        <div class="text-muted small" th:text="${route.endPoint}">Вокзал</div>
                    </td>
                    <td th:text="${route.lengthKm != null ? #numbers.formatDecimal(route.lengthKm, 1, 'COMMA', 2, 'POINT') : '—'}">14,50</td>
                    <td>
                        <span class="badge" th:classappend="${route.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${route.active} ? 'Активен' : 'Отключен'">Активен</span>
                    </td>
                    <td class="text-end">
                        <div class="d-flex gap-2 justify-content-end flex-wrap" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN, T(ru.autoenterprise.security.AppRole).DISPATCHER)}">
                            <a class="btn btn-sm btn-outline-dark" th:href="@{|/routes/${route.id}/edit|}">Изменить</a>
                            <form th:action="@{|/routes/${route.id}|}" method="post">
                                <input type="hidden" name="_method" value="delete">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/pagination :: pagination(${page}, ${pagePath})}"></div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
