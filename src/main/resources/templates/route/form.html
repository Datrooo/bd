<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <section class="panel-card" th:object="${route}">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <div class="eyebrow">Маршруты</div>
                <h1 class="section-title mb-1" th:text="${pageTitle}">Новый маршрут</h1>
                <p class="section-description mb-0">Заполните основные параметры маршрута.</p>
            </div>
            <a class="btn btn-outline-dark" th:href="@{/routes}">К списку</a>
        </div>

        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Ошибка.</div>
        </div>

        <form th:action="@{${formAction}}" th:object="${route}" method="post" class="row g-4">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="col-md-3">
                <label class="form-label" for="routeNumber">Номер маршрута</label>
                <input id="routeNumber" th:field="*{routeNumber}" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('routeNumber')}" th:errors="*{routeNumber}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="routeType">Тип</label>
                <select id="routeType" th:field="*{routeType}" class="form-select" required>
                    <option th:each="routeType : ${routeTypes}" th:value="${routeType}" th:text="${routeType}">BUS</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('routeType')}" th:errors="*{routeType}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="name">Название</label>
                <input id="name" th:field="*{name}" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="col-md-5">
                <label class="form-label" for="startPoint">Начальная точка</label>
                <input id="startPoint" th:field="*{startPoint}" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('startPoint')}" th:errors="*{startPoint}"></div>
            </div>
            <div class="col-md-5">
                <label class="form-label" for="endPoint">Конечная точка</label>
                <input id="endPoint" th:field="*{endPoint}" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('endPoint')}" th:errors="*{endPoint}"></div>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="lengthKm">Длина, км</label>
                <input id="lengthKm" th:field="*{lengthKm}" type="number" step="0.01" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('lengthKm')}" th:errors="*{lengthKm}"></div>
            </div>
            <div class="col-md-3 form-check mt-4 ms-3">
                <input id="active" th:field="*{active}" class="form-check-input" type="checkbox">
                <label class="form-check-label" for="active">Маршрут активен</label>
            </div>
            <div class="col-12">
                <label class="form-label" for="notes">Примечания</label>
                <textarea id="notes" th:field="*{notes}" class="form-control" rows="4"></textarea>
            </div>
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-dark" th:text="${submitLabel}">Создать</button>
                <a class="btn btn-outline-dark" th:href="@{/routes}">Отмена</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
