<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Эксплуатационные записи')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <section class="panel-card">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center mb-4">
            <div>
                <div class="eyebrow">Эксплуатация</div>
                <h1 class="section-title mb-1">Эксплуатационные записи</h1>
                <p class="section-description mb-0">Пассажирские, грузовые и служебные записи по использованию транспорта.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-outline-dark" th:href="@{/transportation}">К модулю</a>
                <a class="btn btn-dark" th:href="@{/transportation-records/new}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN, T(ru.autoenterprise.security.AppRole).DISPATCHER)}">Добавить запись</a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Дата</th>
                    <th>Тип</th>
                    <th>Транспорт</th>
                    <th>Маршрут</th>
                    <th>Пробег</th>
                    <th>Рейсы</th>
                    <th>Выручка</th>
                    <th class="text-end">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.isEmpty()}">
                    <td colspan="8" class="text-center text-muted py-4">Записей пока нет.</td>
                </tr>
                <tr th:each="record : ${page.content}">
                    <td th:text="${record.recordDate}">2026-04-28</td>
                    <td th:text="${record.recordType}">PASSENGER</td>
                    <td th:text="${record.vehicleLabel}">INV-001 / А111АА54</td>
                    <td th:text="${record.routeLabel ?: 'Без маршрута'}">12 / Центр - вокзал</td>
                    <td th:text="${#numbers.formatDecimal(record.mileageKm, 1, 'COMMA', 2, 'POINT')}">15,00</td>
                    <td th:text="${record.tripCount}">3</td>
                    <td th:text="${record.revenue != null ? #numbers.formatDecimal(record.revenue, 1, 'COMMA', 2, 'POINT') : 'Не указана'}">4500,00</td>
                    <td class="text-end">
                        <div class="d-flex gap-2 justify-content-end flex-wrap">
                            <a class="btn btn-sm btn-outline-dark" th:href="@{|/transportation-records/${record.id}/edit|}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN, T(ru.autoenterprise.security.AppRole).DISPATCHER)}">Изменить</a>
                            <form th:action="@{|/transportation-records/${record.id}|}" method="post" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN, T(ru.autoenterprise.security.AppRole).DISPATCHER)}">
                                <input type="hidden" name="_method" value="delete">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/pagination :: pagination(${page}, ${pagePath})}"></div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
