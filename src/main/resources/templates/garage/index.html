<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Гаражное хозяйство')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <section class="panel-card">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <h1 class="section-title mb-1">Гаражное хозяйство</h1>
                <p class="section-description mb-0">Объекты хранения и ремонта транспорта, а также история размещения машин.</p>
            </div>
        </div>
        <div class="row g-3">
            <div class="col-md-6">
                <a class="card module-card h-100 text-decoration-none" th:href="@{/garage-objects}">
                    <div class="card-body">
                        <div class="module-tag">CRUD</div>
                        <h2 class="module-title">Объекты гаражного хозяйства</h2>
                        <p class="module-copy">Гаражи, боксы, ремонтные корпуса, стоянки и склады.</p>
                    </div>
                </a>
            </div>
            <div class="col-md-6">
                <a class="card module-card h-100 text-decoration-none" th:href="@{/vehicle-locations}">
                    <div class="card-body">
                        <div class="module-tag">История</div>
                        <h2 class="module-title">Размещение транспорта</h2>
                        <p class="module-copy">История стоянок и перемещений транспорта по объектам хозяйства.</p>
                    </div>
                </a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
