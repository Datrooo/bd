<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Объекты гаражного хозяйства')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <section class="panel-card">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center mb-4">
            <div>
                <div class="eyebrow">Гараж</div>
                <h1 class="section-title mb-1">Объекты гаражного хозяйства</h1>
                <p class="section-description mb-0">Список гаражей, боксов, стоянок и ремонтных зданий.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-outline-dark" th:href="@{/garage}">К модулю</a>
                <a class="btn btn-dark" th:href="@{/garage-objects/new}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN)}">Добавить объект</a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Название</th>
                    <th>Тип</th>
                    <th>Родитель</th>
                    <th>Цех / участок</th>
                    <th>Вместимость</th>
                    <th class="text-end">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">Записей пока нет.</td>
                </tr>
                <tr th:each="garageObject : ${page.content}">
                    <td th:text="${garageObject.name}">Бокс 1</td>
                    <td th:text="${garageObject.objectType}">BOX</td>
                    <td th:text="${garageObject.parentName ?: 'Нет'}">Гараж №1</td>
                    <td th:text="${garageObject.sectionName ?: garageObject.workshopName ?: 'Не задано'}">Транспортный цех</td>
                    <td th:text="${garageObject.capacity ?: 'Не задана'}">20</td>
                    <td class="text-end">
                        <div class="d-flex gap-2 justify-content-end flex-wrap">
                            <a class="btn btn-sm btn-outline-dark" th:href="@{|/garage-objects/${garageObject.id}/edit|}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN)}">Изменить</a>
                            <form th:action="@{|/garage-objects/${garageObject.id}|}" method="post" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN)}">
                                <input type="hidden" name="_method" value="delete">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/pagination :: pagination(${page}, ${pagePath})}"></div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
