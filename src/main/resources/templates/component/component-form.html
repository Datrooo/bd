<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <section class="panel-card" th:object="${component}">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <div class="eyebrow">Агрегаты</div>
                <h1 class="section-title mb-1" th:text="${pageTitle}">Новый агрегат</h1>
                <p class="section-description mb-0">Базовые сведения об агрегате и его текущем статусе.</p>
            </div>
            <a class="btn btn-outline-dark" th:href="@{/components-catalog}">К списку</a>
        </div>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Ошибка.</div>
        </div>
        <form th:action="@{${formAction}}" th:object="${component}" method="post" class="row g-4">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-6">
                <label class="form-label" for="componentType">Тип агрегата</label>
                <input id="componentType" th:field="*{componentType}" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('componentType')}" th:errors="*{componentType}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="serialNumber">Серийный номер</label>
                <input id="serialNumber" th:field="*{serialNumber}" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('serialNumber')}" th:errors="*{serialNumber}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="model">Модель</label>
                <input id="model" th:field="*{model}" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="manufacturer">Производитель</label>
                <input id="manufacturer" th:field="*{manufacturer}" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('manufacturer')}" th:errors="*{manufacturer}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="status">Статус</label>
                <input id="status" th:field="*{status}" class="form-control" readonly>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="productionDate">Дата производства</label>
                <input id="productionDate" th:field="*{productionDate}" type="date" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="purchaseDate">Дата покупки</label>
                <input id="purchaseDate" th:field="*{purchaseDate}" type="date" class="form-control">
            </div>
            <div class="col-12">
                <label class="form-label" for="notes">Примечания</label>
                <textarea id="notes" th:field="*{notes}" class="form-control" rows="4"></textarea>
            </div>
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-dark" th:text="${submitLabel}">Сохранить</button>
                <a class="btn btn-outline-dark" th:href="@{/components-catalog}">Отмена</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
