<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <section class="panel-card" th:object="${history}">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <div class="eyebrow">Агрегаты</div>
                <h1 class="section-title mb-1" th:text="${pageTitle}">Новая запись истории агрегата</h1>
                <p class="section-description mb-0">История установки, снятия, замены или ремонта агрегата на транспорте.</p>
            </div>
            <a class="btn btn-outline-dark" th:href="@{/component-history}">К списку</a>
        </div>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Ошибка.</div>
        </div>
        <form th:action="@{${formAction}}" th:object="${history}" method="post" class="row g-4">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-6">
                <label class="form-label" for="vehicleId">Транспорт</label>
                <select id="vehicleId" th:field="*{vehicleId}" class="form-select" required>
                    <option value="">Выберите транспорт</option>
                    <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="${vehicle.label}">INV-001 / А111АА54</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('vehicleId')}" th:errors="*{vehicleId}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="componentId">Агрегат</label>
                <select id="componentId" th:field="*{componentId}" class="form-select" required>
                    <option value="">Выберите агрегат</option>
                    <option th:each="component : ${components}" th:value="${component.id}" th:text="${component.label}">ENG-001 / Двигатель</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('componentId')}" th:errors="*{componentId}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="actionType">Тип действия</label>
                <select id="actionType" th:field="*{actionType}" class="form-select" required>
                    <option th:each="actionType : ${actionTypes}" th:value="${actionType}" th:text="${actionType}">INSTALLED</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('actionType')}" th:errors="*{actionType}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="actionDate">Дата</label>
                <input id="actionDate" th:field="*{actionDate}" type="date" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('actionDate')}" th:errors="*{actionDate}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="cost">Стоимость</label>
                <input id="cost" th:field="*{cost}" type="number" step="0.01" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="repairId">Ремонт</label>
                <select id="repairId" th:field="*{repairId}" class="form-select">
                    <option value="">Без ремонта</option>
                    <option th:each="repair : ${repairs}" th:value="${repair.id}" th:text="${repair.label}">#1 / INV-001</option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label" for="notes">Примечания</label>
                <textarea id="notes" th:field="*{notes}" class="form-control" rows="4"></textarea>
            </div>
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-dark" th:text="${submitLabel}">Сохранить</button>
                <a class="btn btn-outline-dark" th:href="@{/component-history}">Отмена</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
