<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('История агрегатов')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <section class="panel-card">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center mb-4">
            <div>
                <div class="eyebrow">Агрегаты</div>
                <h1 class="section-title mb-1">История агрегатов</h1>
                <p class="section-description mb-0">История установки, снятия, замены и ремонта агрегатов.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-outline-dark" th:href="@{/components}">К модулю</a>
                <a class="btn btn-dark" th:href="@{/component-history/new}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN, T(ru.autoenterprise.security.AppRole).MECHANIC)}">Добавить запись</a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Транспорт</th>
                    <th>Агрегат</th>
                    <th>Ремонт</th>
                    <th>Действие</th>
                    <th>Дата</th>
                    <th>Стоимость</th>
                    <th class="text-end">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.isEmpty()}">
                    <td colspan="7" class="text-center text-muted py-4">Записей пока нет.</td>
                </tr>
                <tr th:each="history : ${page.content}">
                    <td th:text="${history.vehicleLabel}">INV-001 / А111АА54</td>
                    <td th:text="${history.componentLabel}">ENG-001 / Двигатель</td>
                    <td th:text="${history.repairLabel ?: 'Без ремонта'}">#1</td>
                    <td th:text="${history.actionType}">INSTALLED</td>
                    <td th:text="${history.actionDate}">2026-04-28</td>
                    <td th:text="${#numbers.formatDecimal(history.cost, 1, 'COMMA', 2, 'POINT')}">12000,00</td>
                    <td class="text-end">
                        <div class="d-flex gap-2 justify-content-end flex-wrap">
                            <a class="btn btn-sm btn-outline-dark" th:href="@{|/component-history/${history.id}/edit|}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN, T(ru.autoenterprise.security.AppRole).MECHANIC)}">Изменить</a>
                            <form th:action="@{|/component-history/${history.id}|}" method="post" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN, T(ru.autoenterprise.security.AppRole).MECHANIC)}">
                                <input type="hidden" name="_method" value="delete">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/pagination :: pagination(${page}, ${pagePath})}"></div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
