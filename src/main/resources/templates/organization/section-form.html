<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <section class="panel-card" th:object="${section}">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <div class="eyebrow">Оргструктура</div>
                <h1 class="section-title mb-1" th:text="${pageTitle}">Новый участок</h1>
                <p class="section-description mb-0">Участок привязывается к цеху и может иметь ответственного мастера.</p>
            </div>
            <a class="btn btn-outline-dark" th:href="@{/organization-sections}">К списку</a>
        </div>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Ошибка.</div>
        </div>
        <form th:action="@{${formAction}}" th:object="${section}" method="post" class="row g-4">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-6">
                <label class="form-label" for="workshopId">Цех</label>
                <select id="workshopId" th:field="*{workshopId}" class="form-select" required>
                    <option value="">Выберите цех</option>
                    <option th:each="workshop : ${workshops}" th:value="${workshop.id}" th:text="${workshop.name}">Транспортный цех</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('workshopId')}" th:errors="*{workshopId}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="masterEmployeeId">Мастер</label>
                <select id="masterEmployeeId" th:field="*{masterEmployeeId}" class="form-select">
                    <option value="">Не назначен</option>
                    <option th:each="employee : ${employees}" th:value="${employee.id}" th:text="${employee.fullName}">Петров П.П.</option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label" for="name">Название</label>
                <input id="name" th:field="*{name}" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="col-12">
                <label class="form-label" for="description">Описание</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
            </div>
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-dark" th:text="${submitLabel}">Сохранить</button>
                <a class="btn btn-outline-dark" th:href="@{/organization-sections}">Отмена</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
