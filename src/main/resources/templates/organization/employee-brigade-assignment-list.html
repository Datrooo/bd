<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Назначения сотрудников')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <section class="panel-card">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center mb-4">
            <div>
                <div class="eyebrow">Оргструктура</div>
                <h1 class="section-title mb-1">Сотрудники в бригадах</h1>
                <p class="section-description mb-0">История закрепления сотрудников за бригадами.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-outline-dark" th:href="@{/organization}">К модулю</a>
                <a class="btn btn-dark" th:href="@{/employee-brigade-assignments/new}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).HR)}">Добавить назначение</a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Сотрудник</th>
                    <th>Бригада</th>
                    <th>Участок</th>
                    <th>Начало</th>
                    <th>Окончание</th>
                    <th>Основное</th>
                    <th class="text-end">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.isEmpty()}">
                    <td colspan="7" class="text-center text-muted py-4">Записей пока нет.</td>
                </tr>
                <tr th:each="assignment : ${page.content}">
                    <td th:text="${assignment.employeeName}">Иванов И.И.</td>
                    <td th:text="${assignment.brigadeName}">Бригада А</td>
                    <td th:text="${assignment.sectionName}">Участок 1</td>
                    <td th:text="${assignment.startDate}">2026-04-28</td>
                    <td th:text="${assignment.endDate ?: 'Без окончания'}">2026-05-01</td>
                    <td th:text="${assignment.primary ? 'Да' : 'Нет'}">Да</td>
                    <td class="text-end">
                        <div class="d-flex gap-2 justify-content-end flex-wrap">
                            <a class="btn btn-sm btn-outline-dark" th:href="@{|/employee-brigade-assignments/${assignment.id}/edit|}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN, T(ru.autoenterprise.security.AppRole).HR)}">Изменить</a>
                            <form th:action="@{|/employee-brigade-assignments/${assignment.id}|}" method="post" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).HR)}">
                                <input type="hidden" name="_method" value="delete">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/pagination :: pagination(${page}, ${pagePath})}"></div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
