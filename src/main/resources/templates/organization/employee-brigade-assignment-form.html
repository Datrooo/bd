<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <section class="panel-card" th:object="${assignment}">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <div class="eyebrow">Оргструктура</div>
                <h1 class="section-title mb-1" th:text="${pageTitle}">Новое назначение сотрудника</h1>
                <p class="section-description mb-0">Закрепление сотрудника за бригадой на период времени.</p>
            </div>
            <a class="btn btn-outline-dark" th:href="@{/employee-brigade-assignments}">К списку</a>
        </div>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Ошибка.</div>
        </div>
        <form th:action="@{${formAction}}" th:object="${assignment}" method="post" class="row g-4">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-6">
                <label class="form-label" for="employeeId">Сотрудник</label>
                <select id="employeeId" th:field="*{employeeId}" class="form-select" required>
                    <option value="">Выберите сотрудника</option>
                    <option th:each="employee : ${employees}" th:value="${employee.id}" th:text="${employee.fullName}">Иванов И.И.</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="brigadeId">Бригада</label>
                <select id="brigadeId" th:field="*{brigadeId}" class="form-select" required>
                    <option value="">Выберите бригаду</option>
                    <option th:each="brigade : ${brigades}" th:value="${brigade.id}" th:text="${brigade.label}">Участок / бригада</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('brigadeId')}" th:errors="*{brigadeId}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="startDate">Дата начала</label>
                <input id="startDate" th:field="*{startDate}" type="date" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="endDate">Дата окончания</label>
                <input id="endDate" th:field="*{endDate}" type="date" class="form-control">
            </div>
            <div class="col-md-4 form-check mt-4 ms-3">
                <input id="primary" th:field="*{primary}" class="form-check-input" type="checkbox">
                <label class="form-check-label" for="primary">Основное назначение</label>
            </div>
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-dark" th:text="${submitLabel}">Сохранить</button>
                <a class="btn btn-outline-dark" th:href="@{/employee-brigade-assignments}">Отмена</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
