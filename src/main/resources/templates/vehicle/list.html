<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Транспорт')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <section class="panel-card">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center mb-4">
            <div>
                <div class="eyebrow">CRUD</div>
                <h1 class="section-title mb-1">Транспорт</h1>
                <p class="section-description mb-0">Список автопарка с базовым управлением карточками техники.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-outline-dark" th:href="@{/vehicle-categories}">Категории транспорта</a>
                <a class="btn btn-outline-dark" th:href="@{/vehicle-acquisitions}">Поступление</a>
                <a class="btn btn-outline-dark" th:href="@{/vehicle-disposals}">Выбытие</a>
                <a class="btn btn-dark" th:href="@{/vehicles/new}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN)}">Добавить транспорт</a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Инв. номер</th>
                    <th>Гос. номер</th>
                    <th>Категория</th>
                    <th>Марка / модель</th>
                    <th>Статус</th>
                    <th>Пробег</th>
                    <th class="text-end">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.isEmpty()}">
                    <td colspan="7" class="text-center text-muted py-4">Записей пока нет.</td>
                </tr>
                <tr th:each="vehicle : ${page.content}">
                    <td th:text="${vehicle.inventoryNumber}">INV-001</td>
                    <td th:text="${vehicle.registrationNumber}">А111АА77</td>
                    <td th:text="${vehicle.categoryName}">BUS</td>
                    <td>
                        <div th:text="${vehicle.brandName}">ЛиАЗ</div>
                        <div class="text-muted small" th:text="${vehicle.modelName}">5292</div>
                    </td>
                    <td><span class="badge text-bg-light border" th:text="${vehicle.status}">ACTIVE</span></td>
                    <td th:text="${#numbers.formatDecimal(vehicle.currentMileage, 1, 'COMMA', 2, 'POINT')}">356,00</td>
                    <td class="text-end">
                        <div class="d-flex gap-2 justify-content-end flex-wrap">
                            <a class="btn btn-sm btn-outline-dark"
                               th:href="@{|/vehicles/${vehicle.id}/edit|}"
                               th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN, T(ru.autoenterprise.security.AppRole).DISPATCHER, T(ru.autoenterprise.security.AppRole).MECHANIC)}">
                                Изменить
                            </a>
                            <form th:action="@{|/vehicles/${vehicle.id}|}" method="post" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN)}">
                                <input type="hidden" name="_method" value="delete">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/pagination :: pagination(${page}, ${pagePath})}"></div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
