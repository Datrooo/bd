<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Поступление транспорта')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <section class="panel-card">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center mb-4">
            <div>
                <div class="eyebrow">Транспорт</div>
                <h1 class="section-title mb-1">Документы поступления</h1>
                <p class="section-description mb-0">Покупка, передача или лизинг транспорта.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-outline-dark" th:href="@{/vehicles}">К транспорту</a>
                <a class="btn btn-dark" th:href="@{/vehicle-acquisitions/new}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN)}">Добавить документ</a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Транспорт</th>
                    <th>Дата</th>
                    <th>Тип</th>
                    <th>Поставщик</th>
                    <th>Стоимость</th>
                    <th class="text-end">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">Записей пока нет.</td>
                </tr>
                <tr th:each="acquisition : ${page.content}">
                    <td th:text="${acquisition.vehicleLabel}">INV-001 / А111АА54</td>
                    <td th:text="${acquisition.acquisitionDate}">2026-04-28</td>
                    <td th:text="${acquisition.acquisitionType}">PURCHASE</td>
                    <td th:text="${acquisition.supplierName ?: 'Не указан'}">Поставщик</td>
                    <td th:text="${acquisition.cost != null ? #numbers.formatDecimal(acquisition.cost, 1, 'COMMA', 2, 'POINT') : 'Не указана'}">500000,00</td>
                    <td class="text-end">
                        <div class="d-flex gap-2 justify-content-end flex-wrap">
                            <a class="btn btn-sm btn-outline-dark" th:href="@{|/vehicle-acquisitions/${acquisition.id}/edit|}" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN)}">Изменить</a>
                            <form th:action="@{|/vehicle-acquisitions/${acquisition.id}|}" method="post" th:if="${@roleAccess.hasAny(#authentication, T(ru.autoenterprise.security.AppRole).SUPERADMIN, T(ru.autoenterprise.security.AppRole).ADMIN)}">
                                <input type="hidden" name="_method" value="delete">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/pagination :: pagination(${page}, ${pagePath})}"></div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
