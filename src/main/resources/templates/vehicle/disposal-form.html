<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <section class="panel-card" th:object="${disposal}">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <div class="eyebrow">Транспорт</div>
                <h1 class="section-title mb-1" th:text="${pageTitle}">Новый документ выбытия</h1>
                <p class="section-description mb-0">Оформление выбытия транспорта из парка.</p>
            </div>
            <a class="btn btn-outline-dark" th:href="@{/vehicle-disposals}">К списку</a>
        </div>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Ошибка.</div>
        </div>
        <form th:action="@{${formAction}}" th:object="${disposal}" method="post" class="row g-4">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-6">
                <label class="form-label" for="vehicleId">Транспорт</label>
                <select id="vehicleId" th:field="*{vehicleId}" class="form-select" required>
                    <option value="">Выберите транспорт</option>
                    <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="${vehicle.label}">INV-001 / А111АА54</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('vehicleId')}" th:errors="*{vehicleId}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="disposalDate">Дата</label>
                <input id="disposalDate" th:field="*{disposalDate}" type="date" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('disposalDate')}" th:errors="*{disposalDate}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="disposalType">Тип</label>
                <select id="disposalType" th:field="*{disposalType}" class="form-select" required>
                    <option th:each="disposalType : ${disposalTypes}" th:value="${disposalType}" th:text="${disposalType}">WRITE_OFF</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('disposalType')}" th:errors="*{disposalType}"></div>
            </div>
            <div class="col-md-8">
                <label class="form-label" for="reason">Причина</label>
                <textarea id="reason" th:field="*{reason}" class="form-control" rows="2"></textarea>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="documentNumber">Номер документа</label>
                <input id="documentNumber" th:field="*{documentNumber}" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('documentNumber')}" th:errors="*{documentNumber}"></div>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="amountReceived">Сумма</label>
                <input id="amountReceived" th:field="*{amountReceived}" type="number" step="0.01" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('amountReceived')}" th:errors="*{amountReceived}"></div>
            </div>
            <div class="col-12">
                <label class="form-label" for="notes">Примечания</label>
                <textarea id="notes" th:field="*{notes}" class="form-control" rows="4"></textarea>
            </div>
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-dark" th:text="${submitLabel}">Сохранить</button>
                <a class="btn btn-outline-dark" th:href="@{/vehicle-disposals}">Отмена</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
