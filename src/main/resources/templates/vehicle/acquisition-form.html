<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <section class="panel-card" th:object="${acquisition}">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <div class="eyebrow">Транспорт</div>
                <h1 class="section-title mb-1" th:text="${pageTitle}">Новый документ поступления</h1>
                <p class="section-description mb-0">Оформление поступления транспорта в парк.</p>
            </div>
            <a class="btn btn-outline-dark" th:href="@{/vehicle-acquisitions}">К списку</a>
        </div>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Ошибка.</div>
        </div>
        <form th:action="@{${formAction}}" th:object="${acquisition}" method="post" class="row g-4">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-6">
                <label class="form-label" for="vehicleId">Транспорт</label>
                <select id="vehicleId" th:field="*{vehicleId}" class="form-select" required>
                    <option value="">Выберите транспорт</option>
                    <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="${vehicle.label}">INV-001 / А111АА54</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('vehicleId')}" th:errors="*{vehicleId}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="acquisitionDate">Дата</label>
                <input id="acquisitionDate" th:field="*{acquisitionDate}" type="date" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('acquisitionDate')}" th:errors="*{acquisitionDate}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="acquisitionType">Тип</label>
                <select id="acquisitionType" th:field="*{acquisitionType}" class="form-select" required>
                    <option th:each="acquisitionType : ${acquisitionTypes}" th:value="${acquisitionType}" th:text="${acquisitionType}">PURCHASE</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('acquisitionType')}" th:errors="*{acquisitionType}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="supplierName">Поставщик</label>
                <input id="supplierName" th:field="*{supplierName}" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('supplierName')}" th:errors="*{supplierName}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="documentNumber">Номер документа</label>
                <input id="documentNumber" th:field="*{documentNumber}" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('documentNumber')}" th:errors="*{documentNumber}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="cost">Стоимость</label>
                <input id="cost" th:field="*{cost}" type="number" step="0.01" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}"></div>
            </div>
            <div class="col-12">
                <label class="form-label" for="notes">Примечания</label>
                <textarea id="notes" th:field="*{notes}" class="form-control" rows="4"></textarea>
            </div>
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-dark" th:text="${submitLabel}">Сохранить</button>
                <a class="btn btn-outline-dark" th:href="@{/vehicle-acquisitions}">Отмена</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
