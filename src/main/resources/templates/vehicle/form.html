<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <section class="panel-card" th:object="${vehicle}">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <div class="eyebrow">Транспорт</div>
                <h1 class="section-title mb-1" th:text="${pageTitle}">Новый транспорт</h1>
                <p class="section-description mb-0">Заполните основные данные транспортного средства.</p>
            </div>
            <a class="btn btn-outline-dark" th:href="@{/vehicles}">К списку</a>
        </div>

        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Ошибка.</div>
        </div>

        <form th:action="@{${formAction}}" th:object="${vehicle}" method="post" class="row g-4">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="col-md-6">
                <label class="form-label" for="inventoryNumber">Инвентарный номер</label>
                <input id="inventoryNumber" th:field="*{inventoryNumber}" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('inventoryNumber')}" th:errors="*{inventoryNumber}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="registrationNumber">Гос. номер</label>
                <input id="registrationNumber" th:field="*{registrationNumber}" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('registrationNumber')}" th:errors="*{registrationNumber}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="categoryId">Категория</label>
                <select id="categoryId" th:field="*{categoryId}" class="form-select" required>
                    <option value="">Выберите категорию</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">BUS</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="status">Статус</label>
                <select id="status" th:field="*{status}" class="form-select" required>
                    <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}">ACTIVE</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="brandName">Марка</label>
                <input id="brandName" th:field="*{brandName}" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('brandName')}" th:errors="*{brandName}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="modelName">Модель</label>
                <input id="modelName" th:field="*{modelName}" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="vin">VIN</label>
                <input id="vin" th:field="*{vin}" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('vin')}" th:errors="*{vin}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="manufactureYear">Год выпуска</label>
                <input id="manufactureYear" th:field="*{manufactureYear}" type="number" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('manufactureYear')}" th:errors="*{manufactureYear}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="currentMileage">Пробег</label>
                <input id="currentMileage" th:field="*{currentMileage}" type="number" step="0.01" class="form-control" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('currentMileage')}" th:errors="*{currentMileage}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="purchaseDate">Дата покупки</label>
                <input id="purchaseDate" th:field="*{purchaseDate}" type="date" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="commissioningDate">Дата ввода в эксплуатацию</label>
                <input id="commissioningDate" th:field="*{commissioningDate}" type="date" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="passengerCapacity">Пассажировместимость</label>
                <input id="passengerCapacity" th:field="*{passengerCapacity}" type="number" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('passengerCapacity')}" th:errors="*{passengerCapacity}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="loadCapacityKg">Грузоподъемность, кг</label>
                <input id="loadCapacityKg" th:field="*{loadCapacityKg}" type="number" step="0.01" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('loadCapacityKg')}" th:errors="*{loadCapacityKg}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="cargoVolumeM3">Объем кузова, м³</label>
                <input id="cargoVolumeM3" th:field="*{cargoVolumeM3}" type="number" step="0.01" class="form-control">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('cargoVolumeM3')}" th:errors="*{cargoVolumeM3}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="bodyType">Тип кузова</label>
                <input id="bodyType" th:field="*{bodyType}" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="taxiLicenseNumber">Лицензия такси</label>
                <input id="taxiLicenseNumber" th:field="*{taxiLicenseNumber}" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="servicePurpose">Служебное назначение</label>
                <input id="servicePurpose" th:field="*{servicePurpose}" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="color">Цвет</label>
                <input id="color" th:field="*{color}" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="engineNumber">Номер двигателя</label>
                <input id="engineNumber" th:field="*{engineNumber}" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="chassisNumber">Номер шасси</label>
                <input id="chassisNumber" th:field="*{chassisNumber}" class="form-control">
            </div>
            <div class="col-12">
                <label class="form-label" for="notes">Примечания</label>
                <textarea id="notes" th:field="*{notes}" class="form-control" rows="4"></textarea>
            </div>

            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-dark" th:text="${submitLabel}">Создать</button>
                <a class="btn btn-outline-dark" th:href="@{/vehicles}">Отмена</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
