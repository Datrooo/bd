server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auto-enterprise-is
  config:
    import: optional:file:./config/application-local.yml
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false

app:
  reports:
    max-rows: 500
    timeout-seconds: 15
  security:
    show-dev-accounts: false
  sql-console:
    max-rows: 200
    timeout-seconds: 10
    datasource:
      url: ""
      username: ""
      password: ""
      driver-class-name: org.postgresql.Driver

logging:
  level:
    org.flywaydb: INFO
    org.springframework.security: INFO
